name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy librosa soundfile langgraph langchain-core anthropic scikit-learn joblib

      - name: Test DSP
        run: python tests/test_dsp.py

      - name: Test EQ projection
        run: python tests/test_eq_projection.py

      - name: Test EQ app reader
        run: python tests/test_eq_app_reader.py

      - name: Test classifier
        run: python tests/test_classifier.py

      - name: Test EQ specs
        run: python tests/test_eq_specs.py

      - name: Test genre classifier
        run: python tests/test_genre_classifier.py

      - name: Test noise classifier
        run: python tests/test_noise_classifier.py

      - name: Test profile store
        run: python tests/test_profile_store.py

      - name: Test agent trace
        run: python tests/test_agent_trace.py
